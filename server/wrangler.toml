name = "wasel-chat"
main = "worker.js"
compatibility_date = "2025-06-01"

rules = [{ type = "Text", globs = ["app.html"], fallthrough = true }]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[[durable_objects.bindings]]
name = "GAME"
class_name = "GameRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GameRoom"]
