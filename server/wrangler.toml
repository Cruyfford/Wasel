name = "wasel-chat"
main = "worker.js"
compatibility_date = "2025-06-01"

rules = [{ type = "Text", globs = ["app.html", "lib/*.txt"], fallthrough = true }]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v3"
deleted_classes = ["GameRoom"]
