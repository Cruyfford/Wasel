<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>واصل</title>
<style>
:root{--bg:#07090f;--glass:rgba(28,32,44,.55);--glass2:rgba(255,255,255,.07);--line:rgba(255,255,255,.08);--text:#f2f4f8;--muted:#8b93a7;
--g1:#00d1a0;--g2:#00a3ff;--grad:linear-gradient(135deg,var(--g1),var(--g2));--in:rgba(255,255,255,.08);--blue:#7cd8ff;--red:#ff5f6d;
--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--ease:cubic-bezier(.2,.9,.25,1.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Arabic","SF Pro Rounded","Geeza Pro",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 15% 10%,#00d1a033,transparent 70%),radial-gradient(45% 40% at 90% 30%,#00a3ff2e,transparent 70%),radial-gradient(50% 40% at 40% 100%,#7b5cff26,transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(6deg)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .2s var(--ease),background .2s}
button:active{transform:scale(.92)}
input,textarea{font:inherit;color:var(--text)}
.hidden{display:none!important}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--line)}
.view{position:fixed;inset:0;display:flex;flex-direction:column;animation:in .35s var(--ease)}
@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
header{position:relative;z-index:5;margin:calc(var(--st) + 8px) 10px 0;padding:8px 10px;border-radius:26px;display:flex;align-items:center;gap:10px;min-height:58px;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--line);box-shadow:0 10px 30px #0006}
header h1{font-size:24px;margin:0 6px;flex:1;font-weight:800;letter-spacing:-.3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass2)}
.ib svg{width:21px;height:21px;fill:var(--text)}
.av{width:50px;height:50px;border-radius:18px;flex:none;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;position:relative;box-shadow:inset 0 1px 0 #ffffff40}
.av.sm{width:40px;height:40px;border-radius:14px;font-size:16px}
.av.xl{width:128px;height:128px;border-radius:44px;font-size:50px}
.dot{position:absolute;bottom:-2px;left:-2px;width:14px;height:14px;border-radius:50%;background:var(--g1);border:3px solid var(--bg);box-shadow:0 0 10px var(--g1)}
/* auth */
#auth{justify-content:center;padding:28px;gap:14px}
#auth .logo{text-align:center;margin-bottom:14px}
#auth .logo div{width:96px;height:96px;margin:0 auto 16px;border-radius:32px;background:var(--grad);display:grid;place-items:center;box-shadow:0 20px 50px #00c2b455;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
#auth .logo svg{width:52px;height:52px;fill:#fff}
#auth h2{margin:0;font-size:34px;font-weight:800}
#auth p{color:var(--muted);margin:6px 0 0}
.field{background:var(--glass2);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;outline:none;font-size:16px;transition:border .2s,box-shadow .2s}
.field:focus{border-color:var(--g1);box-shadow:0 0 0 4px #00d1a022}
.btn{background:var(--grad);color:#fff;border-radius:20px;padding:16px;font-weight:800;font-size:16px;box-shadow:0 12px 30px #00b4c040}
.btn:disabled{opacity:.5}
.link{color:var(--g1);text-align:center;padding:8px;font-weight:600}
.err{color:var(--red);text-align:center;min-height:20px;font-size:14px}
/* list */
.tabs{position:fixed;z-index:6;bottom:calc(var(--sb) + 14px);right:50%;transform:translateX(50%);display:flex;gap:4px;padding:5px;border-radius:30px;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--line);box-shadow:0 12px 40px #000a}
.tabs button{padding:11px 22px;color:var(--muted);font-weight:700;border-radius:24px;font-size:15px}
.tabs button.on{color:#fff;background:var(--glass2);box-shadow:inset 0 1px 0 #ffffff22}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 8px calc(var(--sb) + 100px)}
.row{display:flex;gap:13px;align-items:center;padding:11px 12px;border-radius:22px;animation:pop .4s var(--ease) both}
.row:active{background:var(--glass2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.row .mid{flex:1;min-width:0}
.row .top{display:flex;justify-content:space-between;gap:8px}
.row .nm{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:12px;color:var(--muted);flex:none}
.row .tm.u{color:var(--g1);font-weight:700}
.row .sub{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.row .pv{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--grad);color:#fff;border-radius:12px;min-width:22px;height:22px;font-size:12px;display:grid;place-items:center;padding:0 7px;font-weight:800;box-shadow:0 4px 12px #00b4c055}
.empty{color:var(--muted);text-align:center;padding:80px 30px;line-height:1.9}
.fab{position:fixed;z-index:6;left:16px;bottom:calc(var(--sb) + 14px);width:58px;height:58px;border-radius:22px;background:var(--grad);display:grid;place-items:center;box-shadow:0 14px 34px #00b4c066}
.fab svg{width:26px;height:26px;fill:#fff}
.conn{margin:8px 18px 0;border-radius:14px;background:#ffb02022;color:#ffc857;text-align:center;font-size:13px;padding:6px}
/* chat */
#chat header .who{flex:1;min-width:0}
#chat header .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
#chat header .who span{font-size:12px;color:var(--g1)}
#msgs{flex:1;overflow-y:auto;padding:12px 12px 8px;-webkit-overflow-scrolling:touch}
.day{text-align:center;margin:14px 0}
.day span{background:var(--glass2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--muted);font-size:12px;padding:5px 14px;border-radius:12px;font-weight:600}
.b{animation:none!important;max-width:78%;padding:8px 13px 5px;border-radius:22px;margin:3px 0;position:relative;font-size:15.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;clear:both;animation:bub .35s var(--ease) both}
@keyframes bub{from{opacity:0;transform:translateY(8px) scale(.94)}}
.b.o{background:var(--grad);float:left;border-bottom-left-radius:7px;box-shadow:0 6px 18px #00a8c033}
.b.a{animation:bub .35s var(--ease) both!important}
.b.i{background:var(--in);float:right;border-bottom-right-radius:7px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line)}
.b .meta{font-size:10.5px;color:#ffffffb0;float:left;margin:7px 10px 0 0;display:flex;gap:3px;align-items:center;direction:ltr}
.tick{font-size:12px;letter-spacing:-4px;padding-right:4px}
.tick.r{color:#fff;text-shadow:0 0 6px #fff}
.b.call{display:flex;gap:8px;align-items:center}
.clr{clear:both}
.e2e{margin:6px auto 12px;max-width:320px;text-align:center;font-size:12.5px;line-height:1.6;color:#ffd98a;background:#ffd25a14;border:1px solid #ffd25a26;border-radius:14px;padding:8px 12px;cursor:pointer}
.composer{display:flex;gap:8px;align-items:flex-end;margin:0 10px calc(var(--sb) + 10px);padding:6px;border-radius:28px;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--line)}
.composer textarea{flex:1;resize:none;background:transparent;border:0;padding:11px 14px;max-height:120px;outline:none;font-size:16px;line-height:1.35}
.send{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px #00b4c055}
.send svg{width:20px;height:20px;fill:#fff;transform:scaleX(-1)}
/* sheet */
.sheet{position:fixed;inset:0;background:#0009;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;z-index:20;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet .box{margin:10px;width:100%;border-radius:32px;padding:24px 20px calc(var(--sb) + 18px);display:flex;flex-direction:column;gap:12px;background:var(--glass);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--line);animation:up .4s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{margin:0 0 4px;font-size:20px}
/* profile */
#profile .body{padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center;overflow-y:auto}
#profile label{align-self:stretch;color:var(--muted);font-size:13px;font-weight:600;margin-top:4px}
/* call */
#call{position:fixed;inset:0;z-index:50;background:#05070c;display:flex;flex-direction:column;align-items:center;overflow:hidden;animation:fade .3s}
#call::before{content:"";position:absolute;inset:-30%;background:radial-gradient(35% 30% at 30% 30%,#00d1a055,transparent 70%),radial-gradient(35% 30% at 70% 60%,#00a3ff55,transparent 70%),radial-gradient(30% 30% at 40% 90%,#7b5cff44,transparent 70%);filter:blur(30px);animation:drift 10s ease-in-out infinite alternate}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1}
#lv{position:absolute;top:calc(var(--st) + 16px);left:16px;width:112px;height:164px;border-radius:24px;object-fit:cover;background:#222;z-index:3;transform:scaleX(-1);border:1px solid #ffffff40;box-shadow:0 10px 30px #000a}
#call .info{position:relative;z-index:2;margin-top:calc(var(--st) + 100px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;text-shadow:0 2px 8px #000}
#call .info .av{box-shadow:0 0 0 0 #00d1a066;animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 30px #00d1a000}100%{box-shadow:0 0 0 0 #00d1a000}}
#call.live .info .av{animation:none}
#call.vid .info{margin-top:calc(var(--st) + 24px)}
#call.vid.live .info .av{display:none}
#call .info b{font-size:30px;font-weight:800}
#call .info span{color:#ffffffcc;font-variant-numeric:tabular-nums}
#call .ctrls{position:absolute;bottom:calc(var(--sb) + 30px);z-index:3;display:flex;justify-content:center;gap:16px;padding:12px 16px;border-radius:44px;background:#ffffff14;backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid #ffffff22}
#kIncoming{gap:60px!important;background:transparent!important;border:0!important;backdrop-filter:none!important}
.cb{width:62px;height:62px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center}
.cb svg{width:27px;height:27px;fill:#fff}
.cb.on{background:#fff}.cb.on svg{fill:#111}
.cb.red{background:var(--red);box-shadow:0 10px 30px #ff5f6d66}.cb.grn{background:var(--grad);box-shadow:0 10px 30px #00d1a066;animation:pulse 1.6s infinite}
#kIncoming .cb{width:72px;height:72px}
.cb.red svg{transform:rotate(135deg)}
.toast{position:fixed;top:calc(var(--st) + 80px);left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:22px;z-index:99;font-size:14px;font-weight:600;background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line);animation:up2 .35s var(--ease)}
@keyframes up2{from{opacity:0;transform:translate(-50%,-14px)}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
 <symbol id="i-chat" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6 2 11c0 2.3 1 4.4 2.6 6L3.5 21.5l4.8-1.6c1.1.4 2.4.6 3.7.6 5.5 0 10-4 10-9S17.5 2 12 2z"/></symbol>
 <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></symbol>
 <symbol id="i-video" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1v10c0 .6.4 1 1 1h12c.6 0 1-.4 1-1v-3.5l4 4v-11l-4 4z"/></symbol>
 <symbol id="i-send" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></symbol>
 <symbol id="i-back" viewBox="0 0 24 24"><path d="M8.6 16.6L13.2 12 8.6 7.4 10 6l6 6-6 6z"/></symbol>
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
 <symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></symbol>
 <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 14c1.7 0 3-1.3 3-3V5c0-1.7-1.3-3-3-3S9 3.3 9 5v6c0 1.7 1.3 3 3 3zm5.3-3c0 3-2.5 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.4 2.7 6.2 6 6.7V21h2v-3.3c3.3-.5 6-3.3 6-6.7h-1.7z"/></symbol>
 <symbol id="i-micoff" viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .7-.2 1.4-.4 2l1.2 1.2c.6-.9.9-2 .9-3.2zm-4 .2V5c0-1.7-1.3-3-3-3S9 3.3 9 5v.2l6 6zM4.3 3L3 4.3l6 6V11c0 1.7 1.3 3 3 3 .2 0 .4 0 .7-.1l1.7 1.7c-.7.3-1.5.5-2.3.5-2.8 0-5.3-2.1-5.3-5.1H5c0 3.4 2.7 6.2 6 6.7V21h2v-3.3c.9-.1 1.8-.5 2.5-.9l4.2 4.2 1.3-1.3L4.3 3z"/></symbol>

 <symbol id="i-camoff" viewBox="0 0 24 24"><path d="M21 6.5l-4 4V7c0-.6-.4-1-1-1H9.8L21 17.2V6.5zM3.3 2L2 3.3 4.7 6H4c-.6 0-1 .4-1 1v10c0 .6.4 1 1 1h12c.2 0 .4-.1.5-.2l3.2 3.2 1.3-1.3L3.3 2z"/></symbol>
 <symbol id="i-out" viewBox="0 0 24 24"><path d="M10 17l1.4-1.4L8.8 13H20v-2H8.8l2.6-2.6L10 7l-5 5 5 5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></symbol>
</svg>

<!-- تسجيل الدخول -->
<div id="auth" class="view hidden">
  <div class="logo"><div><svg><use href="#i-chat"/></svg></div><h2>واصل</h2><p id="authSub">سجّل الدخول بالبريد الإلكتروني</p></div>
  <input id="aName" class="field hidden" placeholder="اسمك" autocomplete="name">
  <input id="aEmail" class="field" type="email" placeholder="البريد الإلكتروني" autocomplete="email" autocapitalize="off" dir="ltr">
  <input id="aPass" class="field" type="password" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr">
  <div class="err" id="aErr"></div>
  <button class="btn" id="aGo">دخول</button>
  <button class="link" id="aSwitch">ليس لديك حساب؟ أنشئ حساباً</button>
</div>

<!-- القائمة -->
<div id="home" class="view hidden">
  <header>
    <h1>واصل</h1>
    <button class="ib" id="hProfile"><svg><use href="#i-user"/></svg></button>
  </header>
  <div class="conn hidden" id="connBar">جارٍ الاتصال…</div>
  <div class="tabs"><button class="on" data-tab="chats">الدردشات</button><button data-tab="calls">المكالمات</button></div>
  <div class="list" id="chatList"></div>
  <div class="list hidden" id="callList"></div>
  <button class="fab" id="newChat"><svg><use href="#i-plus"/></svg></button>
</div>

<!-- المحادثة -->
<div id="chat" class="view hidden">
  <header>
    <button class="ib" id="cBack"><svg><use href="#i-back"/></svg></button>
    <div class="av sm" id="cAv"></div>
    <div class="who"><b id="cName"></b><span id="cStatus"></span></div>
    <button class="ib" id="cVideo"><svg><use href="#i-video"/></svg></button>
    <button class="ib" id="cVoice"><svg><use href="#i-phone"/></svg></button>
  </header>
  <div id="msgs"></div>
  <div class="composer">
    <textarea id="cInput" rows="1" maxlength="4000" placeholder="رسالة"></textarea>
    <button class="send" id="cSend"><svg><use href="#i-send"/></svg></button>
  </div>
</div>

<!-- الملف الشخصي -->
<div id="profile" class="view hidden">
  <header><button class="ib" id="pBack"><svg><use href="#i-back"/></svg></button><h1>الملف الشخصي</h1></header>
  <div class="body">
    <div class="av xl" id="pAv"></div>
    <label>الاسم</label><input class="field" id="pName" maxlength="40">
    <label>الحالة</label><input class="field" id="pAbout" maxlength="140" placeholder="متاح">
    <label>البريد</label><input class="field" id="pEmail" disabled dir="ltr">
    <button class="btn" id="pSave" style="align-self:stretch">حفظ</button>
    <button class="link" id="pLogout" style="color:var(--red)">تسجيل الخروج</button>
  </div>
</div>

<!-- دردشة جديدة -->
<div class="sheet hidden" id="newSheet">
  <div class="box">
    <h3>دردشة جديدة</h3>
    <input class="field" id="nEmail" type="email" placeholder="بريد الشخص" dir="ltr" autocapitalize="off">
    <div class="err" id="nErr"></div>
    <button class="btn" id="nGo">ابدأ الدردشة</button>
    <button class="link" id="nCancel">إلغاء</button>
  </div>
</div>

<!-- رقم الأمان -->
<div class="sheet hidden" id="safeSheet">
  <div class="box" style="align-items:center;text-align:center">
    <h3>🔒 التحقق من التشفير</h3>
    <div style="color:var(--muted);font-size:14px;line-height:1.7">قارن هذا الرقم مع الرقم عند <b id="sName"></b> (وجهاً لوجه أو بمكالمة). إذا تطابق، فالمحادثة والمكالمات مشفّرة بينكما فقط ولا يوجد أي تلاعب.</div>
    <div id="sNum" dir="ltr" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;font:600 19px ui-monospace,Menlo,monospace;letter-spacing:1px;margin:10px 0"></div>
    <button class="btn" style="align-self:stretch" onclick="$('safeSheet').classList.add('hidden')">تم</button>
  </div>
</div>

<!-- المكالمة -->
<div id="call" class="hidden">
  <video id="rv" autoplay playsinline class="hidden"></video>
  <video id="lv" autoplay playsinline muted class="hidden"></video>
  <audio id="ra" autoplay playsinline></audio>
  <div class="info"><div class="av xl" id="kAv"></div><b id="kName"></b><span id="kState"></span></div>
  <div class="ctrls" id="kIncoming">
    <button class="cb grn" id="kAccept"><svg><use href="#i-phone"/></svg></button>
    <button class="cb red" id="kReject"><svg><use href="#i-phone"/></svg></button>
  </div>
  <div class="ctrls hidden" id="kActive">
    <button class="cb" id="kMute"><svg><use href="#i-mic"/></svg></button>
    <button class="cb vidonly" id="kCam"><svg><use href="#i-video"/></svg></button>
    <button class="cb vidonly" id="kFlip"><svg><use href="#i-cam"/></svg></button>
    <button class="cb red" id="kHang"><svg><use href="#i-phone"/></svg></button>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const API = location.origin;
const S = {
  token: localStorage.getItem("w_token"),
  me: JSON.parse(localStorage.getItem("w_me") || "null"),
  users: {}, chats: [], msgs: {}, peer: null, ws: null, wsOk: false, retry: 0,

// ---------- التشفير من طرف لطرف ----------
const TE = new TextEncoder(), TD = new TextDecoder();
const b64 = (buf) => { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192)); return btoa(s); };
const ub64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const EC = { name: "ECDH", namedCurve: "P-256" };
const pwKey = (pass) => crypto.subtle.importKey("raw", TE.encode(pass), "PBKDF2", false, ["deriveBits", "deriveKey"]);
// كلمة المرور الحقيقية لا تُرسل للسيرفر أبداً؛ يُرسل بدلها مفتاح مشتق منها
async function authKey(email, pass) {
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: TE.encode("wasel-auth:" + email.trim().toLowerCase()), iterations: 200000 }, await pwKey(pass), 256);
  return b64(bits);
}
async function wrapKey(pass, salt) {
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: 200000 }, await pwKey(pass), { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function newIdentity(pass) {
  const kp = await crypto.subtle.generateKey(EC, true, ["deriveKey"]);
  const pub = b64(await crypto.subtle.exportKey("raw", kp.publicKey));
  const pk8 = await crypto.subtle.exportKey("pkcs8", kp.privateKey);
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await wrapKey(pass, salt), pk8);
  return { pub, priv: b64(pk8), backup: b64(salt) + "." + b64(iv) + "." + b64(ct) };
}
async function openBackup(pass, backup) {
  const [salt, iv, ct] = backup.split(".").map(ub64);
  return b64(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await wrapKey(pass, salt), ct));
}
let PRIV = null; const SK = {}; const PT = new Map();
const myPriv = () => (PRIV ||= crypto.subtle.importKey("pkcs8", ub64(localStorage.getItem("w_priv")), EC, false, ["deriveKey"]));
async function sharedKey(uid) {
  let u = S.users[uid];
  if (!u || !u.pub) { try { u = S.users[uid] = { ...u, ...(await api("/api/user?id=" + uid)).user }; } catch {} }
  if (!u || !u.pub) throw new Error("nokey");
  const id = uid + ":" + u.pub;
  return (SK[id] ||= (async () => {
    const pk = await crypto.subtle.importKey("raw", ub64(u.pub), EC, false, []);
    return crypto.subtle.deriveKey({ name: "ECDH", public: pk }, await myPriv(), { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  })());
}
async function enc(uid, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const out = "e1:" + b64(iv) + ":" + b64(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await sharedKey(uid), TE.encode(text)));
  PT.set(out, text);
  return out;
}
async function dec(uid, body) {
  if (!body || !body.startsWith("e1:")) return body;
  if (PT.has(body)) return PT.get(body);
  try {
    const [, iv, ct] = body.split(":");
    const t = TD.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(iv) }, await sharedKey(uid), ub64(ct)));
    PT.set(body, t); return t;
  } catch { return "🔒 تعذّر فك التشفير"; }
}
const txt = (m) => m.text ?? (PT.has(m.body) ? PT.get(m.body) : m.body && m.body.startsWith("e1:") ? "🔒 …" : m.body);
const decAll = (peer, list) => Promise.all(list.map((m) => dec(peer, m.body)));
// رقم الأمان: نفس الرقم يظهر عند الطرفين إذا لم يتلاعب أحد بالمفاتيح
async function safetyNumber(uid) {
  const keys = [S.me.pub, S.users[uid].pub].sort();
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", TE.encode(keys.join("|"))));
  const groups = [];
  for (let i = 0; i < 12; i++) groups.push(String(((h[i * 2] << 8) | h[i * 2 + 1]) % 100000).padStart(5, "0"));
  return groups;
}

function connect() {
  if (!S.token) return;
  const ws = new WebSocket(API.replace(/^http/, "ws") + "/ws?token=" + encodeURIComponent(S.token));
  S.ws = ws;
  ws.onopen = () => { S.wsOk = true; S.retry = 0; $("connBar").classList.add("hidden"); loadChats(); if (S.peer) openChat(S.peer.id, true); flushQueue(); };
  ws.onclose = () => {
    S.wsOk = false; if (!S.token) return;
    $("connBar").classList.remove("hidden");
    setTimeout(connect, Math.min(10000, 800 * 2 ** S.retry++));
  };
  ws.onmessage = (e) => { const m = JSON.parse(e.data); S.inq = (S.inq || Promise.resolve()).then(() => onWs(m)).catch(() => {}); };
}
setInterval(() => { if (S.wsOk) S.ws.send('{"t":"ping"}'); }, 25000);
function wsSend(o) { if (S.wsOk) { S.ws.send(JSON.stringify(o)); return true; } return false; }

async function onWs(m) {
  if (m.t === "msg") {
    const msg = m.m, peer = msg.a === S.me.id ? msg.b : msg.a;
    if (m.user) S.users[m.user.id] = { ...S.users[m.user.id], ...m.user };
    await dec(peer, msg.body);
    pushMsg(peer, msg);
    if (S.peer && S.peer.id === peer && !document.hidden && !$("chat").classList.contains("hidden")) wsSend({ t: "read", to: peer });
    else if (msg.a !== S.me.id) beep(1);
    bumpChat(peer, msg, msg.a !== S.me.id);
  } else if (m.t === "ack") {
    const peer = m.m.b, list = S.msgs[peer] || [];
    const i = list.findIndex((x) => x.cid === m.cid);
    if (i >= 0) list[i] = m.m; else list.push(m.m);
    S.queue = (S.queue || []).filter((q) => q.cid !== m.cid);
    if (S.peer && S.peer.id === peer) renderMsgs();
    bumpChat(peer, m.m, false);
  } else if (m.t === "status") {
    for (const x of S.msgs[m.with] || []) if (x.a === S.me.id && x.status < m.status && x.id) x.status = m.status;
    const c = S.chats.find((c) => c.user.id === m.with); if (c && c.last.a === S.me.id) c.last.status = Math.max(c.last.status, m.status);
    if (S.peer && S.peer.id === m.with) renderMsgs();
    renderChats();
  } else if (m.t === "presence") {
    const u = S.users[m.id]; if (u) { u.online = m.online; u.last_seen = m.last_seen; }
    if (S.peer && S.peer.id === m.id) $("cStatus").textContent = lastSeen(u);
    renderChats();
  } else if (m.t === "typing") {
    if (S.peer && S.peer.id === m.from) {
      $("cStatus").textContent = "يكتب…";
      clearTimeout(S.typT); S.typT = setTimeout(() => ($("cStatus").textContent = lastSeen(S.users[m.from])), 3000);
    }
  } else if (m.t === "signal") {
    if (m.user) S.users[m.user.id] = { ...S.users[m.user.id], ...m.user };
    onSignal(m.from, m.data);
  }
}

async function loadChats() {

    const d = await api("/api/chats");
    for (const c of d.chats) S.users[c.user.id] = { ...S.users[c.user.id], ...c.user };
    await Promise.all(d.chats.map((c) => dec(c.user.id, c.last.body)));

function bumpChat(peer, msg, incoming) {
  let c = S.chats.find((c) => c.user.id === peer);
  if (!c) { c = { user: S.users[peer] || { id: peer, name: "…" }, last: msg, unread: 0 }; S.chats.unshift(c); if (!S.users[peer]) fetchUser(peer); }
  c.last = msg;
  if (incoming && !(S.peer && S.peer.id === peer && !$("chat").classList.contains("hidden"))) c.unread++;
  S.chats.sort((a, b) => (b.last.ts || 0) - (a.last.ts || 0));
  renderChats();
}

let ICE = null;
async function iceServers() {
  if (ICE && ICE.t > Date.now() - 3600e3) return ICE.s;
  try { const d = await (await fetch(API + "/api/turn")).json(); ICE = { s: d.iceServers, t: Date.now() }; return d.iceServers; }
  catch { return [{ urls: "stun:stun.l.google.com:19302" }]; }
}
async function getMedia(video, facing = "user") {
  return navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    video: video ? { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } } : false,
  });
}
function callUI(state) {
  const u = S.users[C.peer] || { id: C.peer, name: "…" };
  $("call").classList.remove("hidden");
  $("call").classList.toggle("vid", C.video);
  $("call").classList.toggle("live", state === "live");
  avatar($("kAv"), u); $("kName").textContent = u.name;
  $("kIncoming").classList.toggle("hidden", state !== "incoming");
  $("kActive").classList.toggle("hidden", state === "incoming");
  for (const b of document.querySelectorAll(".vidonly")) b.classList.toggle("hidden", !C.video);
  $("lv").classList.toggle("hidden", !C.video || state === "incoming");
  $("rv").classList.toggle("hidden", !C.video || state !== "live");
  const txt = { incoming: C.video ? "مكالمة فيديو واردة…" : "مكالمة صوتية واردة…", calling: "جارٍ الاتصال…", ringing: "يرن…", connecting: "جارٍ التوصيل…", live: "00:00" };
  $("kState").textContent = txt[state] || state;
}
function makePC(servers) {
  const pc = new RTCPeerConnection({ iceServers: servers });
  pc.onicecandidate = (e) => { if (e.candidate) sig({ kind: "ice", c: e.candidate.toJSON() }); };
  pc.ontrack = (e) => {
    const st = e.streams[0] || new MediaStream([e.track]);
    if (C.video) { $("rv").srcObject = st; $("rv").play().catch(() => {}); }
    $("ra").srcObject = st; $("ra").play().catch(() => {});
    if (C.video) $("ra").muted = true;
  };
  pc.onconnectionstatechange = () => {
    if (!C || C.pc !== pc) return;
    const s = pc.connectionState;
    if (s === "connected" && C.state !== "live") goLive();
    if (s === "failed") { toast("تعذّر الاتصال"); endCall(true); }
    if (s === "disconnected") $("kState").textContent = "إعادة الاتصال…";
  };
  return pc;
}
function sig(data) {
  const to = C.peer, callId = C.id, { kind, ...rest } = data;
  S.sigQ = (S.sigQ || Promise.resolve()).then(async () => {
    const payload = Object.keys(rest).length ? { e: await enc(to, JSON.stringify(rest)) } : {};
    wsSend({ t: "signal", to, data: { kind, callId, ...payload } });
  }).catch(() => {});
  return S.sigQ;
}
function goLive() {
  C.state = "live"; C.start = Date.now(); stopRing(); callUI("live");
  clearInterval(C.timer);
  C.timer = setInterval(() => { const s = Math.floor((Date.now() - C.start) / 1000); $("kState").textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60); }, 1000);
}

async function startCall(video) {
  if (C) return;
  if (!S.wsOk) return toast("غير متصل بالسيرفر");
  const peer = S.peer.id;
  C = { peer, id: Math.random().toString(36).slice(2), video, out: true, state: "calling", pendingIce: [] };
  callUI("calling"); ring("out");
  try {
    const local = await getMedia(video);
    if (!C || C.peer !== peer) { local.getTracks().forEach((t) => t.stop()); return; }
    C.local = local;
    if (video) { $("lv").srcObject = C.local; $("lv").play().catch(() => {}); }
    C.pc = makePC(await iceServers());
    C.local.getTracks().forEach((t) => C.pc.addTrack(t, C.local));
    const offer = await C.pc.createOffer();
    await C.pc.setLocalDescription(offer);
    sig({ kind: "offer", sdp: offer.sdp, video });
    C.noAns = setTimeout(() => { if (C && C.state !== "live") { toast("لا يوجد رد"); endCall(true, "noanswer"); } }, 45000);
  } catch (e) {
    toast("لم يُسمح بالمايك/الكاميرا"); cleanup();
  }
}
$("cVoice").onclick = () => startCall(false);
$("cVideo").onclick = () => startCall(true);
async function showSafety() {
  if (!S.peer) return;
  try {
    if (!S.users[S.peer.id].pub) await sharedKey(S.peer.id);
    $("sNum").innerHTML = (await safetyNumber(S.peer.id)).map((g) => `<span>${g}</span>`).join("");
    $("sName").textContent = S.users[S.peer.id].name;
    $("safeSheet").classList.remove("hidden");
  } catch { toast("هذا المستخدم لم يفعّل التشفير بعد"); }
}
$("cName").onclick = showSafety;

async function onSignal(from, d) {
  if (d.e) {
    const plain = await dec(from, d.e);
    try { Object.assign(d, JSON.parse(plain)); } catch { return; } // إشارة لا يمكن فك تشفيرها = مرفوضة
    delete d.e;
  }
  if (d.kind === "offer") {
    if (C) { wsSend({ t: "signal", to: from, data: { kind: "busy", callId: d.callId } }); return; }
    if (!d.sdp) return;
    C = { peer: from, id: d.callId, video: !!d.video, out: false, state: "incoming", offer: d.sdp, pendingIce: [] };
    callUI("incoming"); ring("in");
    wsSend({ t: "signal", to: from, data: { kind: "ringing", callId: d.callId } });
    C.missT = setTimeout(() => { if (C && C.state === "incoming") { logCall("missed"); cleanup(); } }, 45000);
    return;
  }
  if (!C || d.callId !== C.id) return;
  switch (d.kind) {
    case "ringing": if (C.state === "calling") { C.state = "ringing"; $("kState").textContent = "يرن…"; } break;
    case "answer":
      clearTimeout(C.noAns); stopRing(); C.state = "connecting"; callUI("connecting");
      await C.pc.setRemoteDescription({ type: "answer", sdp: d.sdp });
      for (const c of C.pendingIce) C.pc.addIceCandidate(c).catch(() => {});
      C.pendingIce = [];
      break;
    case "ice":
      if (C.pc && C.pc.remoteDescription) C.pc.addIceCandidate(d.c).catch(() => {}); else C.pendingIce.push(d.c);
      break;
    case "reject": toast("تم رفض المكالمة"); endCall(false, "rejected"); break;
    case "busy": toast("الطرف الآخر في مكالمة"); endCall(false, "busy"); break;
    case "unavailable": toast("غير متصل حالياً"); endCall(false, "unavailable"); break;
    case "end":
      if (C.state === "incoming") { logCall("missed"); cleanup(); } else endCall(false);
      break;
  }
}

$("kAccept").onclick = async () => {
  if (!C || C.state !== "incoming") return;
  clearTimeout(C.missT); stopRing(); C.state = "connecting"; callUI("connecting");
  try {
    const local = await getMedia(C.video);
    if (!C) { local.getTracks().forEach((t) => t.stop()); return; }
    C.local = local;
    if (C.video) { $("lv").srcObject = C.local; $("lv").play().catch(() => {}); }
    C.pc = makePC(await iceServers());
    C.local.getTracks().forEach((t) => C.pc.addTrack(t, C.local));
    await C.pc.setRemoteDescription({ type: "offer", sdp: C.offer });
    for (const c of C.pendingIce) C.pc.addIceCandidate(c).catch(() => {});
    C.pendingIce = [];
    const ans = await C.pc.createAnswer();
    await C.pc.setLocalDescription(ans);
    sig({ kind: "answer", sdp: ans.sdp });
  } catch (e) { toast("لم يُسمح بالمايك/الكاميرا"); sig({ kind: "reject" }); cleanup(); }
};
$("kReject").onclick = () => { if (!C) return; sig({ kind: "reject" }); logCall("declined"); cleanup(); };
$("kHang").onclick = () => endCall(true);
$("kMute").onclick = () => {
  if (!C?.local) return;
  const t = C.local.getAudioTracks()[0]; t.enabled = !t.enabled;
  $("kMute").classList.toggle("on", !t.enabled);
  $("kMute").innerHTML = `<svg><use href="#i-${t.enabled ? "mic" : "micoff"}"/></svg>`;
};
$("kCam").onclick = () => {
  const t = C?.local?.getVideoTracks()[0]; if (!t) return; t.enabled = !t.enabled;
  $("kCam").classList.toggle("on", !t.enabled);
  $("kCam").innerHTML = `<svg><use href="#i-${t.enabled ? "video" : "camoff"}"/></svg>`;
};
$("kFlip").onclick = async () => {
  if (!C?.pc || !C.video) return;
  C.facing = C.facing === "environment" ? "user" : "environment";
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: C.facing } });
    const nt = s.getVideoTracks()[0];
    const sender = C.pc.getSenders().find((x) => x.track && x.track.kind === "video");
    await sender.replaceTrack(nt);
    const old = C.local.getVideoTracks()[0]; C.local.removeTrack(old); old.stop(); C.local.addTrack(nt);
    $("lv").srcObject = C.local; $("lv").style.transform = C.facing === "user" ? "scaleX(-1)" : "none";
  } catch { toast("تعذّر تبديل الكاميرا"); }
};

function endCall(notify, reason) {
  if (!C) return;
  if (notify) sig({ kind: "end" });
  const dur = C.start ? Math.floor((Date.now() - C.start) / 1000) : 0;
  logCall(C.out ? (dur ? "out" : reason === "noanswer" ? "noanswer" : "cancelled") : dur ? "in" : "missed", dur);
  // سجل المكالمة داخل الدردشة (يرسله المتصل فقط)
  if (C.out) {
    const label = (C.video ? "مكالمة فيديو" : "مكالمة صوتية") + (dur ? " • " + Math.floor(dur / 60) + ":" + pad(dur % 60) : " • لم يتم الرد");
    sendTo(C.peer, label, "call");
  }
  cleanup();
}
function cleanup() {
  if (!C) return;
  stopRing(); clearTimeout(C.noAns); clearTimeout(C.missT); clearInterval(C.timer);
  try { C.local && C.local.getTracks().forEach((t) => t.stop()); } catch {}
  try { C.pc && C.pc.close(); } catch {}
  $("rv").srcObject = null; $("lv").srcObject = null; $("ra").srcObject = null; $("ra").muted = false;
  $("kMute").classList.remove("on"); $("kMute").innerHTML = '<svg><use href="#i-mic"/></svg>';
  $("kCam").classList.remove("on"); $("kCam").innerHTML = '<svg><use href="#i-video"/></svg>';
  $("lv").style.transform = "";
  $("call").classList.add("hidden");
  C = null;
}
function logCall(type, dur = 0) {
  if (!C) return;
  S.calls.unshift({ peer: C.peer, type, video: C.video, ts: Date.now(), dur });
  S.calls = S.calls.slice(0, 100);
  localStorage.setItem("w_calls", JSON.stringify(S.calls));
  renderCalls();
}
function renderCalls() {
  const el = $("callList");
  if (!S.calls.length) { el.innerHTML = '<div class="empty">لا توجد مكالمات بعد.</div>'; return; }
  const L = { out: ["↗", "صادرة", ""], in: ["↙", "واردة", ""], missed: ["↙", "فائتة", "var(--red)"], declined: ["↙", "مرفوضة", "var(--red)"], noanswer: ["↗", "لم يتم الرد", "var(--red)"], cancelled: ["↗", "ملغاة", ""], rejected: ["↗", "مرفوضة", "var(--red)"], busy: ["↗", "مشغول", ""], unavailable: ["↗", "غير متصل", ""] };
  el.innerHTML = ""; let i = 0;
  for (const c of S.calls) {
    const u = S.users[c.peer] || { id: c.peer, name: "…" }; const l = L[c.type] || L.out;
    const r = document.createElement("div"); r.className = "row"; if (!el.dataset.shown) r.style.animationDelay = Math.min(i++, 12) * 30 + "ms"; else r.style.animation = "none";
    r.innerHTML = `<div class="av"></div><div class="mid"><div class="top"><span class="nm" style="color:${l[2] || "inherit"}">${esc(u.name)}</span><span class="tm">${shortTime(c.ts)} ${hm(c.ts)}</span></div>
      <div class="sub"><span class="pv">${l[0]} ${l[1]}${c.dur ? " • " + Math.floor(c.dur / 60) + ":" + pad(c.dur % 60) : ""}</span><span>${c.video ? "📹" : "📞"}</span></div></div>`;
    avatar(r.querySelector(".av"), u);
    r.onclick = () => { S.peer = u; S.users[u.id] ||= u; startCall(c.video); };
    el.append(r);
  }
}

// ---------- البدء ----------
function start() {
  show("home"); renderChats(); renderCalls(); loadChats(); connect();
  history.replaceState({ v: "home" }, "");
}
if (S.token && S.me) start(); else show("auth");
</script>
