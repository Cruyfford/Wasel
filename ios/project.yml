name: Wasel
options:
  bundleIdPrefix: com.cruyfford
  deploymentTarget:
    iOS: "15.0"
targets:
  Wasel:
    type: application
    platform: iOS
    sources:
      - path: Wasel
    settings:
      base:
        PRODUCT_NAME: Wasel
        PRODUCT_BUNDLE_IDENTIFIER: com.cruyfford.wasel
        INFOPLIST_FILE: Wasel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
